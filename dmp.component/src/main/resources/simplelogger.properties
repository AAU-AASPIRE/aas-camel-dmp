# slf4j-simple, the DMP's runtime logging backend. Defaults stay as slf4j-simple has them (INFO).
#
# Camel's Milo client logs every failed OPC UA (re)connect at INFO with a full stack trace; an unreachable
# station then floods the log with one trace per retry. Its warnings and errors still show.
org.slf4j.simpleLogger.log.org.apache.camel.component.milo.client.internal.SubscriptionManager=warn
